name: Jekyll

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
    - name: Install gems
      run: |
        gem install jekyll
        gem install jekyll-scholar
        gem install jekyll-theme-minimal

    - name: Build site
      run: jekyll build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
